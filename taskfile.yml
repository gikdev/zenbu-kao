# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default: task --list-all
  i: npm install
  t: npm run tsc -- -b
  d: npm run dev
  c: npm run check -- --fix
  f: npm run format -- --fix
  r: npm run generate-routes
  p: npm run build
  z: git archive --format=zip --output=repo.zip HEAD

  # AddShadcnComponent
  a: npm run shadcn -- add {{.CLI_ARGS}}
